    /* 2026 editorial refresh — original StyleIQ restraint with Alta's product depth. */
    :root{
      --ivory:#f5f1eb;--canvas:#e9e3dc;--paper:#fbf8f3;--ink:#241d1a;
      --muted:#716761;--faint:#9c918a;--line:#d8cfc6;
      --gold:#7b3038;--gold-soft:#efe0df;--danger:#8e2934;--green:#3f6455;
      --radius:14px;--shadow:0 24px 70px rgba(55,39,32,.14)
    }
    body{background-color:var(--canvas);background-image:none}
    .rail{background:#211b18;border-right-color:rgba(255,255,255,.07)}
    .rail-head{padding-top:28px}.mark,.brand-lockup-mark{border-radius:3px;border-color:#b9a49c;color:#efe8e1}
    .section-label{background:#211b18;color:#c5a59f;letter-spacing:.08em}
    .screen-link b,.screen-head-brand,.eyebrow,.settings-section-label,.menu-group-label{color:var(--gold)}
    .progress-line span,.evolution-bar span{background:var(--gold)}
    .screen-link[aria-current="page"]{box-shadow:inset 2px 0 #c5a59f;background:rgba(255,255,255,.075)}
    .phone{border-color:#26211f;border-radius:42px;box-shadow:0 32px 72px rgba(48,34,28,.18)}
    .phone::before{background:#26211f}
    .screen-head{background:rgba(245,241,235,.94);border-bottom-color:rgba(95,75,66,.16)}
    .content{padding-left:20px;padding-right:20px}
    .display{font-size:37px;line-height:.98;letter-spacing:-.035em}.title{letter-spacing:-.025em}
    .eyebrow{font-size:9px;letter-spacing:.105em}.body{line-height:1.6}
    .card,.item-card,.signal-card,.muse-profile{border-radius:var(--radius);box-shadow:none}
    .btn{border-radius:10px;min-height:46px}.btn.primary{background:#2b2320;border-color:#2b2320}
    .btn.gold{background:var(--gold);border-color:var(--gold)}

    /* Apple-inspired adaptive system: clarity, deference, depth. */
    :root{
      color-scheme:light;
      --font-ui:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --font-display:"Playfair Display",Georgia,serif;
      --ivory:#f8f6f3;
      --canvas:#efece7;
      --paper:#fffdfa;
      --ink:#1b1716;
      --muted:#6f675f;
      --faint:#9f9387;
      --line:rgba(95,75,66,.16);
      --gold:#c89b45;
      --gold-soft:#f5ead2;
      --danger:#9c3e32;
      --green:#486c52;
      --radius:18px;
      --shadow:0 30px 80px rgba(73,57,45,.18),0 2px 12px rgba(73,57,45,.08);
      --material:rgba(248,246,243,.82);
      --material-heavy:rgba(255,253,250,.94);
      --press:cubic-bezier(.2,.8,.2,1);
    }
    html{font:100%/1.45 var(--font-ui);background:var(--canvas)}
    body{font-family:var(--font-ui);background:var(--canvas);color:var(--ink);letter-spacing:-.006em}
    button,input,textarea,select{font-family:inherit}
    button{min-width:44px;min-height:44px;-webkit-tap-highlight-color:transparent}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(200,155,69,.42);outline-offset:2px}
    .serif,.wordmark,.display,.title,.notes h2,.screen-head h1,.brand-lockup-name,.brand-lockup-mark,.root-wordmark,.mirror-title,.mirror-today-head h2,.mirror-collage-copy h3,.mirror-section-head h3,.mirror-outfit-card b,.mirror-plan-copy h3,.mirror-profile-head h2,.mirror-upload-intro h2,.mirror-studio-head h2,.mirror-studio-meta h3,.profile-look b,.profile-utility b,.profile-stat b,.editorial-metric b,.closet-success h2,.studio-title{font-family:var(--font-display)!important;font-optical-sizing:auto}
    .display{font-size:34px;font-weight:400;line-height:1.04;letter-spacing:-.025em}
    .title{font-size:24px;font-weight:400;line-height:1.1;letter-spacing:-.018em}
    .screen-head h1{font-size:17px;font-weight:500;letter-spacing:-.01em}
    .body{font-size:13px;line-height:1.48;color:var(--muted)}
    .small{font-size:11px;line-height:1.35}
    .eyebrow,.screen-head-brand,.settings-section-label,.menu-group-label{color:var(--accent,var(--gold));font-size:10px;font-weight:600;letter-spacing:.035em;text-transform:none}

    .workspace{grid-template-columns:304px minmax(430px,1fr)}
    .rail{background:rgba(32,28,26,.97);border-right:1px solid rgba(255,255,255,.1);color:#fff}
    .rail-head{padding:26px 22px 20px;border-bottom-color:rgba(255,255,255,.1)}
    .wordmark{font-size:22px;font-weight:650;letter-spacing:-.025em}
    .rail-head p,.progress-row{color:rgba(235,235,245,.62)}
    .progress-line{height:4px;background:rgba(255,255,255,.12)}
    .progress-line span{background:var(--gold)}
    .rail-tools{border-bottom-color:rgba(255,255,255,.1)}
    .rail-search,.phase-filter{height:44px;border:0;background:rgba(118,118,128,.24);color:#fff;border-radius:12px}
    .rail-search::placeholder{color:rgba(235,235,245,.5)}
    .section-label{background:rgba(32,28,26,.95);color:#bdb4ac;font-weight:600;letter-spacing:.04em;backdrop-filter:blur(18px) saturate(160%)}
    .screen-link{min-height:48px;color:rgba(235,235,245,.72);border-radius:12px;transition:background 140ms ease-out,transform 100ms ease-out}
    .screen-link:hover{background:rgba(118,118,128,.2)}
    .screen-link:active{transform:scale(.985)}
    .screen-link[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 var(--gold)}
    .screen-link[aria-current="page"] b,.screen-link[aria-current="page"] .screen-link-icon{color:var(--gold)}
    .screen-link b{color:#dfb866;font-variant-numeric:tabular-nums}

    .stage{padding:24px;background:
      radial-gradient(circle at 62% -10%,rgba(255,253,250,.98),transparent 40%),
      radial-gradient(circle at 84% 18%,rgba(200,155,69,.13),transparent 25%),
      radial-gradient(circle at 40% 78%,rgba(72,108,82,.08),transparent 29%),
      var(--canvas)}
    .stage-shell{max-width:1010px;grid-template-columns:390px minmax(290px,1fr);gap:34px}
    .phone{width:390px;max-width:390px;height:min(844px,calc(100dvh - 48px));min-height:720px;border:8px solid #272321;border-radius:52px;background:var(--ivory);box-shadow:var(--shadow)}
    .phone::before{display:block;top:10px;width:124px;height:35px;border-radius:22px;background:#000}
    .status{height:51px;padding:13px 23px 0;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
    .app{padding-top:51px}
    .content{padding:12px 20px calc(112px + env(safe-area-inset-bottom));background-color:var(--ivory);background-image:
      radial-gradient(circle at 8% 4%,rgba(200,155,69,.2),transparent 30%),
      radial-gradient(circle at 96% 34%,rgba(72,108,82,.13),transparent 31%),
      radial-gradient(circle at 34% 92%,rgba(200,155,69,.12),transparent 34%),

    function homeScreen(s){if(s.id==='D-01')return emptyState(s);if(s.id==='D-02')return shell('Today',`<section class="home-greeting"><div><p class="eyebrow">Good morning</p><h2 class="display">Amelia</h2></div><button class="muse-entry" onclick="go('M-01')"><img src="${assets.muse}" alt="Muse"><span>Ask<br>Muse</span></button></section><div class="home-context"><b>28°</b><span>Office</span><span>Light breeze</span></div><section class="daily-look" aria-label="Muse daily recommendation"><img src="${assets.look3}" alt="Tailored espresso, ivory, and black outfit for an office day in Cairo"><span class="daily-look-badge">28° · Office · Cairo</span><button class="daily-look-save" aria-label="Save this Look" onclick="go('E-01')">${icon('heart')}</button><span class="daily-look-count">1 / 3</span></section><div class="closet-strip" aria-label="Pieces in this Look">${[['Blazer',assets.blazer,'Owned'],['Ivory top',assets.top,'Owned'],['Black trousers',assets.bottom,'Owned'],['Oxblood bag',assets.bag,'Suggested']].map(([name,image,state])=>`<button class="closet-piece" onclick="go('C-02')"><span class="closet-piece-media"><img src="${image}" alt="${name}"><em>${state}</em></span><b>${name}</b><small>${state==='Owned'?'From your Closet':'One useful addition'}</small></button>`).join('')}</div><div class="closet-progress"><b>3 / 4 from your Closet</b><button onclick="go('C-01')">View pieces</button></div><div class="home-actions"><button class="btn primary" onclick="go('H-01')">${icon('user')} Try on</button><button class="btn" onclick="go('F-01')">${icon('shirt')} Make it mine</button></div>`,{active:'home'});if(s.id==='D-03')return shell('Today',`<div class="stack"><div class="skeleton" style="height:46px;width:65%"></div><div class="skeleton" style="height:280px"></div><p class="body">Considering Cairo weather, your calendar, and your newest Closet piece…</p></div>`,{active:'home'});if(['D-04','D-05'].includes(s.id))return outfitFamilies(s.title);if(s.id==='D-06')return shell('Complete the look',`${outfitPreview()}<div class="card" style="margin-top:14px"><p class="eyebrow">One gap</p><h2 class="title">This outfit needs shoes.</h2><p class="body">No compatible pair is currently in your Closet. Choose an owned pair or review a shopping suggestion.</p><div class="row" style="margin-top:14px"><button class="btn grow" onclick="go('F-07')">Choose from Closet</button><button class="btn grow primary" onclick="go('K-02')">See suggestions</button></div></div>`,{active:'home'})}

    function overlayMarkup(){if(!overlay)return'';if(overlay==='altaAdd')return `<div class="overlay"><div class="sheet"><div class="grab"></div><div class="between"><div><p class="eyebrow">Add to ${pickerRole}</p><h3 class="title">Add items to StyleIQ</h3></div><button class="icon-btn" onclick="closeOverlay()" aria-label="Close">×</button></div><p class="body">Choose the same three import routes used throughout Alta. New items can be prettified before they join this outfit.</p><div class="choice-list" style="margin-top:16px"><button class="choice" onclick="go('B-02')"><span class="row"><span class="icon-wrap">${icon('shirt')}</span><span><b>Photos</b><small class="body" style="display:block">Choose one or many garment photos</small></span></span><span>›</span></button><button class="choice" onclick="go('B-04')"><span class="row"><span class="icon-wrap">${icon('search')}</span><span><b>Search items</b><small class="body" style="display:block">Search by keyword or product URL</small></span></span><span>›</span></button><button class="choice" onclick="go('B-09')"><span class="row"><span class="icon-wrap">${icon('bag')}</span><span><b>Forward receipts</b><small class="body" style="display:block">Import purchases from email</small></span></span><span>›</span></button></div><button class="btn wide" style="margin-top:12px" onclick="openPicker(pickerRole)">Choose an existing item</button></div></div>`;if(overlay==='picker'){const items=Object.entries(alternatives).flatMap(([role,xs])=>xs.map((x,i)=>makeItem(role,i))).filter(x=>(pickerSource==='Closet'?x.owned:!x.owned));return `<div class="overlay"><div class="sheet"><div class="grab"></div><div class="between"><div><p class="eyebrow">Add or replace</p><h3 class="title">${pickerRole}</h3></div><button class="icon-btn" onclick="closeOverlay()" aria-label="Close">×</button></div><div class="source-tabs"><button class="${pickerSource==='Closet'?'active':''}" onclick="setSource('Closet')">Closet</button><button class="${picker     function pushHistory(){canvasState.history.push(JSON.stringify(canvasState.items));if(canvasState.history.length>8)canvasState.history.shift()}

    function savedScreen(s){if(s.id==='G-01')return shell('Saved Looks',`<div class="between"><div><p class="eyebrow">Lookbook</p><h2 class="title">Your Looks</h2></div><button class="btn small-btn">Select</button></div><div class="chips"><button class="chip active">Newest</button><button class="chip">Worn</button><button class="chip">Work</button><button class="chip">Trips</button></div><button class="item-card" style="width:100%;margin-top:14px" onclick="go('G-02')"><img src="${assets.look}" style="height:300px" alt="Business Casual Look"><span class="copy"><b>${canvasState.title}</b><small class="body" style="display:block">Created in Style Studio</small></span></button>`,{active:'profile'});if(s.id==='G-02')return shell(canvasState.title,`<img class="hero-img" src="${assets.look}" alt="Saved Look"><div class="between" style="margin-top:13px"><span><p class="eyebrow">Saved Look</p><h2 class="title">${canvasState.title}</h2></span><span class="pill">Followers</span></div><p class="body">${canvasState.date} · ${canvasState.location}</p><div class="row" style="margin-top:12px"><button class="btn grow" onclick="go('F-01')">Customize</button><button class="btn grow" onclick="go('I-01')">Add to calendar</button></div>`,{active:'profile'});if(s.id==='G-03')return shell('Included items',canvasState.items.map(x=>`<div class="pack-row"><img src="${x.image}" alt=""><span><b>${x.name}</b><small class="body" style="display:block">${x.brand} · ${x.owned?'Owned':'Suggested'}</small></span>${x.owned?'<span class="pill green">Closet</span>':'<button class="btn small-btn">Shop</button>'}</div>`).join(''),{active:'profile'});if(s.id==='G-04')return shell('Look details',`<p class="eyebrow">Classification</p><h2 class="title">How StyleIQ understands it</h2>${[['Dress code','Business casual'],['Seasons','Spring · Autumn'],['Styles','Tailored · Minimal'],['Tags','Meeting · Polished · Neutral']].map(x=>`<div class="select-row"><b class="grow">${x[0]}</b><span class="body">${x[1]}</span>     function mirrorScreen(s){if(s.id==='D-02')return mirrorToday();if(s.id==='C-01')return mirrorCloset();if(s.id==='I-01')return mirrorPlanner();if(s.id==='K-01')return mirrorDiscover();if(s.id==='L-01')return mirrorProfile();if(['F-01','F-02','F-03'].includes(s.id))return mirrorStudioV2();if(['A-07','H-01'].includes(s.id))return mirrorTwinIntro();if(['A-08','H-02','H-03'].includes(s.id))return mirrorUpload('face');if(s.id==='H-04')return mirrorUpload('body');if(s.id==='B-02')return mirrorItemUpload();if(s.id==='G-02')return shell('Saved Look',`<img class="hero-img" style="height:390px" src="${assets.look}" alt="Saved soft tailoring outfit"><div class="mirror-page-head" style="margin-top:14px"><span><p class="eyebrow">Saved Look</p><h2 class="mirror-title">${canvasState.title}</h2><p class="body">${canvasState.date} · ${canvasState.location}</p></span><button class="mirror-circle-action" onclick="toast('Look saved')">${icon('bookmark')}</button></div><div class="mirror-actions"><button class="btn primary" onclick="go('E-01')">Wear</button><button class="btn" onclick="go('I-01')">Add to Planner</button><button class="btn" onclick="go('H-01')">Try On</button><button class="btn" onclick="go('F-01')">Edit in Studio</button></div>`,{active:'profile'});return null}
    function renderScreen(s){const mirrored=mirrorScreen(s);if(mirrored)return mirrored;if(s.section==='S')return entryScreen(s);if(s.section==='A')return onboarding(s);if(s.section==='B')return importScreen(s);if(s.section==='C')return closetScreen(s);if(s.section==='D')return homeScreen(s);if(s.section==='E')return actionScreen(s);if(s.section==='F')return studioScreen(s);if(s.section==='G')return savedScreen(s);if(s.section==='H')return avatarScreen(s);if(s.section==='I')return plannerScreen(s);if(s.section==='J')return tripScreenV2(s);if(s.section==='K')return discoverScreen(s);if(s.section==='L')return profileScreen(s);return museScreen(s)}
    function renderNotes(s){notes.innerHTML=`<span class="phase-pill">Phase ${s.phase}</span><p class="eyebrow" style="margin-top:16px">${s.id} · ${sections[s.section]}</p><h2>${s.title}</h2><p class="body">${s.detail}</p><div class="notes-grid"><div class="metric"><b>Surface</b><span>${['B-01','I-03','J-11'].includes(s.id)?'Bottom sheet / menu':s.section==='F'?'Full-screen editor':'Mobile screen / state'}</span></div><div class="metric"><b>Style</b><span>Ivory, espresso, signature gold</span></div><div class="metric"><b>Inventory</b><span>${screens.indexOf(s)+1} of ${screens.length}</span></div><div class="metric"><b>Keyboard</b><span><span class="kbd">←</span> <span class="kbd">→</span></span></div></div>${s.section==='F'?'<ul><li>Editable title and persistent draft</li><li>Flat lay and optional Style Twin</li><li>Owned versus Shop provenance</li><li>Category layers, visibility, replace, remove</li><li>Closet/Wishlist selector with search and filters</li><li>Date, location, calendar, feedback, Save Look</li></ul>':''}<div class="row" style="margin-top:18px"><button class="btn grow" onclick="prev()">Previous</button><button class="btn primary grow" onclick="next()">Next</button></div>`}
    function renderList(){const q=document.getElementById('screen-search').value.toLowerCase(),phase=document.getElementById('phase-filter').value;let html='';for(const [key,label] of Object.entries(sections)){const subset=screens.filter(s=>s.section===key&&(phase==='all'||String(s.phase)===phase)&&(`${s.id} ${s.title} ${s.detail}`.toLowerCase().includes(q)));if(!subset.length)continue;html+=`<div class="section-label">${key} · ${label}</div>${subset.map(s=>`<button class="screen-link" data-id="${s.id}" aria-current="${s.id===currentId?'page':'false'}" onclick="go('${s.id}')"><b>${s.id}</b><span class="screen-link-icon">${icon(screenIconName(s))}</span><span class="screen-link-title">${s.title}</span></button>`).join('')}`}document.getElementById('screen-list').innerHTML=html;window.lucide?.createIcons({attrs:{'stroke-width':1.5}})}
    function render(){const s=screens.find(x=>x.id===currentId)||screens[0];currentId=s.id;app.dataset.screen=s.id;document.getElementById('device-status').classList.toggle('light',['S-00','S-01'].includes(s.id));document.getElementById('mobile-index').hidden=s.section==='S';app.innerHTML=renderScreen(s);decorateSettingsRows();connectPrivacySettings();enrichCoreScreens(s);window.lucide?.createIcons({attrs:{'stroke-width':1.5}});renderNotes(s);const inventory=[...notes.querySelectorAll('.metric')].find(x=>x.querySelector('b')?.textContent==='Inventory');if(inventory)inventory.querySelector('span').textContent=`${screens.indexOf(s)+1} of ${screens.length}`;renderList();document.getElementById('total-count').textContent=`${screens.length} / ${screens.length}`}

      if(s.id==='M-02')return shell('Why this Look',`<p class="eyebrow">Muse’s recommendation</p><h2 class="display">Polished now. Easy later.</h2><img class="hero-img" src="${assets.look3}" alt="Tailored office Look recommended by Muse"><div class="reason-list"><div class="reason-row"><span class="icon-wrap">${icon('calendar')}</span><span><b>Your day</b><small class="body" style="display:block">Office-focused, with enough ease for dinner after work.</small></span></div><div class="reason-row"><span class="icon-wrap">${icon('spark')}</span><span><b>Your style</b><small class="body" style="display:block">Clean tailoring and warm neutrals match your strongest preferences.</small></span></div><div class="reason-row"><span class="icon-wrap">${icon('shirt')}</span><span><b>Your Closet</b><small class="body" style="display:block">Every piece is owned. The blazer has not been worn in 12 days.</small></span></div></div><div class="muse-actions"><button class="btn" onclick="go('D-04')">Alternatives</button><button class="btn primary" onclick="go('F-01')">Customize</button></div><button class="btn wide" style="margin-top:8px" onclick="go('E-01')">Wear & save this Look</button>`,{active:'home'});
      return shell('Wardrobe insight',`<div class="muse-profile-head"><img src="${assets.muse}" alt="Muse"><span><p class="eyebrow">Based on 14 saved decisions</p><h2 class="title">You don’t need another blazer.</h2></span></div><p class="body" style="margin-top:12px">Your real gap is a lightweight knit that works under the pieces you already own. It would unlock six combinations across work and weekend Looks.</p><div class="card" style="margin-top:16px"><img class="hero-img" style="height:180px" src="${assets.top2}" alt="Lightweight rust knit suggestion"><div class="between" style="margin-top:12px"><span><b>Lightweight knit</b><small class="body" style="display:block">Warm neutral · 6 possible Looks</small></span><span class="pill gold">Useful gap</span></div></div><div class="reason-list"><div class="reason-row"><span class="icon-wrap">${icon('check')}</span><span><b>No duplicate purchase</b><small class="body" style="display:block">Different role from your existing tops and layers.</small></span></div><div class="reason-row"><span class="icon-wrap">${icon('heart')}</span><span><b>High confidence</b><small class="body" style="display:block">Matches your palette, budget, and saved silhouettes.</small></span></div></div><button class="btn primary wide" onclick="go('K-02')">Review one suggestion</button><button class="btn wide" style="margin-top:8px" onclick="go('D-04')">Style without buying</button>`,{active:'home'});
    }
  </script>
