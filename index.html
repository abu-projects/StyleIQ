<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>StyleIQ — Premium Auth light study</title>
    <meta
      name="description"
      content="A calm, adaptive personal-styling experience for your wardrobe, plans, and taste."
    />
    <meta name="theme-color" content="#fafafa" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  </head>
  <body>
    <svg
      aria-hidden="true"
      width="0"
      height="0"
      style="position: absolute; overflow: hidden; pointer-events: none"
    >
      <defs>
        <filter
          id="auth-liquid-refraction"
          x="0"
          y="0"
          width="100%"
          height="100%"
          color-interpolation-filters="sRGB"
        >
          <feImage
            href="images/auth-liquid-refraction.png"
            width="100%"
            height="100%"
            preserveAspectRatio="none"
            result="authMap"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="authMap"
            scale="-42"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
        <filter
          id="navigation-glass-surface"
          x="0"
          y="0"
          width="100%"
          height="100%"
          color-interpolation-filters="sRGB"
        >
          <feImage
            href="images/navigation-glass-surface.png"
            width="100%"
            height="100%"
            preserveAspectRatio="none"
            result="barMap"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="barMap"
            scale="-30"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
        <filter
          id="header-liquid-refraction"
          x="0"
          y="0"
          width="100%"
          height="100%"
          color-interpolation-filters="sRGB"
        >
          <feImage
            href="images/header-liquid-refraction.png"
            width="100%"
            height="100%"
            preserveAspectRatio="none"
            result="headerMap"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="headerMap"
            scale="-42"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
        <filter
          id="nav-liquid-lens"
          x="0"
          y="0"
          width="100%"
          height="100%"
          color-interpolation-filters="sRGB"
        >
          <feImage
            href="images/nav-liquid-lens.png"
            width="100%"
            height="100%"
            preserveAspectRatio="none"
            result="lensMap"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="lensMap"
            scale="-20"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
        <filter
          id="liquid-glass-soft"
          x="-10%"
          y="-10%"
          width="120%"
          height="120%"
          color-interpolation-filters="sRGB"
        >
          <feFlood flood-color="#808080" result="neutral" />
          <feTurbulence
            type="fractalNoise"
            baseFrequency=".018 .032"
            numOctaves="2"
            seed="23"
            result="glassNoise"
          />
          <feMorphology
            in="SourceAlpha"
            operator="erode"
            radius="11"
            result="glassInner"
          />
          <feComposite
            in="SourceAlpha"
            in2="glassInner"
            operator="out"
            result="glassEdge"
          />
          <feComposite
            in="glassNoise"
            in2="glassEdge"
            operator="in"
            result="edgeNoise"
          />
          <feMerge result="dispMap">
            <feMergeNode in="neutral" />
            <feMergeNode in="edgeNoise" />
          </feMerge>
          <feDisplacementMap
            in="SourceGraphic"
            in2="dispMap"
            scale="-18"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
        <filter
          id="liquid-glass-deep"
          x="-14%"
          y="-14%"
          width="128%"
          height="128%"
          color-interpolation-filters="sRGB"
        >
          <feFlood flood-color="#808080" result="neutralDeep" />
          <feTurbulence
            type="fractalNoise"
            baseFrequency=".014 .026"
            numOctaves="2"
            seed="41"
            result="deepNoise"
          />
          <feMorphology
            in="SourceAlpha"
            operator="erode"
            radius="18"
            result="deepInner"
          />
          <feComposite
            in="SourceAlpha"
            in2="deepInner"
            operator="out"
            result="deepEdge"
          />
          <feComposite
            in="deepNoise"
            in2="deepEdge"
            operator="in"
            result="deepEdgeNoise"
          />
          <feMerge result="deepDispMap">
            <feMergeNode in="neutralDeep" />
            <feMergeNode in="deepEdgeNoise" />
          </feMerge>
          <feDisplacementMap
            in="SourceGraphic"
            in2="deepDispMap"
            scale="-24"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>
    <svg class="sr-only" aria-hidden="true">
      <symbol id="i-back" viewBox="0 0 24 24">
        <path d="m15 18-6-6 6-6" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" />
      </symbol>
      <symbol id="i-shirt" viewBox="0 0 24 24">
        <path d="m8 3-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3a4 4 0 0 1-8 0Z" />
      </symbol>
      <symbol id="i-compass" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="m15 9-2 5-5 2 2-5z" />
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21a8 8 0 0 1 16 0" />
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path
          d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"
        />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-4-4" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
        <circle cx="12" cy="12" r="2.5" />
      </symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <path
          d="m3 3 18 18M10.6 10.7a2 2 0 0 0 2.7 2.7M9.9 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3M6.6 6.6C3.6 8.4 2 12 2 12s3.5 7 10 7a10 10 0 0 0 3-.5"
        />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14" />
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M16 3v4M8 3v4M3 10h18" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol id="i-spark" viewBox="0 0 24 24">
        <path
          d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5zM19 17l.6 2.4L22 20l-2.4.6L19 23l-.6-2.4L16 20l2.4-.6z"
        />
      </symbol>
      <symbol id="i-bag" viewBox="0 0 24 24">
        <path d="M5 8h14l-1 13H6zM9 8a3 3 0 0 1 6 0" />
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none" />
        <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none" />
        <circle cx="19" cy="12" r="1.2" fill="currentColor" stroke="none" />
      </symbol>
    </svg>
    <svg class="sr-only" aria-hidden="true">
      <symbol id="i-bell" viewBox="0 0 24 24">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"
        />
      </symbol>
      <symbol id="i-logout" viewBox="0 0 24 24">
        <path
          d="M10 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h5M14 8l4 4-4 4M9 12h9"
        />
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10zM14 7l3 3" />
      </symbol>
      <symbol id="i-help" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M9.8 9a2.4 2.4 0 1 1 3.5 2.1c-.9.5-1.3 1-1.3 2M12 17h.01" />
      </symbol>
    </svg>
    <div class="workspace">
      <aside class="rail" aria-label="Complete screen index">
        <div class="rail-head">
          <div class="wordmark">StyleIQ</div>
          <p>
            Adaptive wardrobe intelligence<br />Editorial liquid-material system
          </p>
          <div class="progress-row">
            <span>Screen inventory</span><b id="total-count">120 / 120</b>
          </div>
          <div class="progress-line"><span></span></div>
        </div>
        <div class="rail-tools">
          <input
            id="screen-search"
            class="rail-search"
            type="search"
            placeholder="Find a screen…"
            aria-label="Find a screen"
          /><select
            id="phase-filter"
            class="phase-filter"
            aria-label="Filter by phase"
          >
            <option value="all">All</option>
            <option value="1">P1</option>
            <option value="2">P2</option>
            <option value="3">P3</option>
          </select>
        </div>
        <div id="screen-list" class="screen-list"></div>
      </aside>
      <main class="stage">
        <div class="stage-shell">
          <div class="phone-wrap">
            <div class="phone">
              <div id="device-status" class="status">
                <span>9:41</span
                ><span class="status-icons" aria-hidden="true"
                  ><span class="cellular"><i></i><i></i><i></i><i></i></span
                  ><svg class="wifi" viewBox="0 0 16 12">
                    <path d="M1.5 3.8a9.8 9.8 0 0 1 13 0" />
                    <path d="M4.2 6.6a5.7 5.7 0 0 1 7.6 0" />
                    <path d="M6.6 9a2.2 2.2 0 0 1 2.8 0" />
                    <circle cx="8" cy="10.4" r="1" /></svg
                  ><span class="battery"></span
                ></span>
              </div>
              <div id="app" class="app"></div>
              <div
                id="toast"
                class="toast"
                role="status"
                aria-live="polite"
              ></div>
            </div>
          </div>
          <aside id="notes" class="notes" aria-live="polite"></aside>
        </div>
      </main>
    </div>
    <button
      id="mobile-index"
      class="floating-index"
      aria-label="Open screen index"
    >
      <svg class="icon"><use href="#i-search" /></svg>
    </button>
    <script src="app.js"></script>
  </body>
</html>
