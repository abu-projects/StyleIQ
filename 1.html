    /* 2026 editorial refresh — original StyleIQ restraint with Alta's product depth. */
    :root{
      --ivory:#f5f1eb;--canvas:#e9e3dc;--paper:#fbf8f3;--ink:#241d1a;
      --muted:#716761;--faint:#9c918a;--line:#d8cfc6;
      --gold:#c89b45;--gold-soft:#f5ead2;--danger:#8e2934;--green:#3f6455;
      --radius:14px;--shadow:0 24px 70px rgba(55,39,32,.14)
    }
    body{background-color:var(--canvas);background-image:none}
    .rail{background:#211b18;border-right-color:rgba(255,255,255,.07)}
    .rail-head{padding-top:28px}.mark,.brand-lockup-mark{border-radius:3px;border-color:#b9a49c;color:#efe8e1}
    .section-label{background:#211b18;color:#c89b45;letter-spacing:.08em}
    .screen-link b,.screen-head-brand,.eyebrow,.settings-section-label,.menu-group-label{color:var(--gold)}
    .progress-line span,.evolution-bar span{background:var(--gold)}
    .screen-link[aria-current="page"]{box-shadow:inset 2px 0 #c5a59f;background:rgba(255,255,255,.075)}
    .phone{border-color:#26211f;border-radius:42px;box-shadow:0 32px 72px rgba(48,34,28,.18)}
    .phone::before{background:#26211f}
    .screen-head{background:rgba(245,241,235,.94);border-bottom-color:rgba(95,75,66,.16)}
    .content{padding-left:20px;padding-right:20px}
    .display{font-size:37px;line-height:.98;letter-spacing:-.035em}.title{letter-spacing:-.025em}
    .eyebrow{font-size:9px;letter-spacing:.105em}.body{line-height:1.6}
    .card,.item-card,.signal-card,.muse-profile{border-radius:var(--radius);box-shadow:none}
    .btn{border-radius:10px;min-height:46px}.btn.primary{background:#2b2320;border-color:#2b2320}
    .btn.gold{background:var(--gold);border-color:var(--gold)}

    /* Apple-inspired adaptive system: clarity, deference, depth. */
    :root{
      color-scheme:light;
      --font-ui:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --font-display:"Playfair Display",Georgia,serif;
      --ivory:#f8f6f3;
      --canvas:#efece7;
      --paper:#fffdfa;
      --ink:#1b1716;
      --muted:#6f675f;
      --faint:#9f9387;
      --line:rgba(95,75,66,.16);
      --gold:#c89b45;
      --gold-soft:#f5ead2;
      --danger:#9c3e32;
      --green:#486c52;
      --radius:18px;
      --shadow:0 30px 80px rgba(73,57,45,.18),0 2px 12px rgba(73,57,45,.08);
      --material:rgba(248,246,243,.82);
      --material-heavy:rgba(255,253,250,.94);
      --press:cubic-bezier(.2,.8,.2,1);
    }
    html{font:100%/1.45 var(--font-ui);background:var(--canvas)}
    body{font-family:var(--font-ui);background:var(--canvas);color:var(--ink);letter-spacing:-.006em}
    button,input,textarea,select{font-family:inherit}
    button{min-width:44px;min-height:44px;-webkit-tap-highlight-color:transparent}
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(200,155,69,.42);outline-offset:2px}
    .serif,.wordmark,.display,.title,.notes h2,.screen-head h1,.brand-lockup-name,.brand-lockup-mark,.root-wordmark,.mirror-title,.mirror-today-head h2,.mirror-collage-copy h3,.mirror-section-head h3,.mirror-outfit-card b,.mirror-plan-copy h3,.mirror-profile-head h2,.mirror-upload-intro h2,.mirror-studio-head h2,.mirror-studio-meta h3,.profile-look b,.profile-utility b,.profile-stat b,.editorial-metric b,.closet-success h2,.studio-title{font-family:var(--font-display)!important;font-optical-sizing:auto}
    .display{font-size:34px;font-weight:400;line-height:1.04;letter-spacing:-.025em}
    .title{font-size:24px;font-weight:400;line-height:1.1;letter-spacing:-.018em}
    .screen-head h1{font-size:17px;font-weight:500;letter-spacing:-.01em}
    .body{font-size:13px;line-height:1.48;color:var(--muted)}
    .small{font-size:11px;line-height:1.35}
    .eyebrow,.screen-head-brand,.settings-section-label,.menu-group-label{color:var(--accent,var(--gold));font-size:10px;font-weight:600;letter-spacing:.035em;text-transform:none}

    .workspace{grid-template-columns:304px minmax(430px,1fr)}
    .rail{background:rgba(32,28,26,.97);border-right:1px solid rgba(255,255,255,.1);color:#fff}
    .rail-head{padding:26px 22px 20px;border-bottom-color:rgba(255,255,255,.1)}
    .wordmark{font-size:22px;font-weight:650;letter-spacing:-.025em}
    .rail-head p,.progress-row{color:rgba(235,235,245,.62)}
    .progress-line{height:4px;background:rgba(255,255,255,.12)}
    .progress-line span{background:var(--gold)}
    .rail-tools{border-bottom-color:rgba(255,255,255,.1)}
    .rail-search,.phase-filter{height:44px;border:0;background:rgba(118,118,128,.24);color:#fff;border-radius:12px}
    .rail-search::placeholder{color:rgba(235,235,245,.5)}
    .section-label{background:rgba(32,28,26,.95);color:#bdb4ac;font-weight:600;letter-spacing:.04em;backdrop-filter:blur(18px) saturate(160%)}
    .screen-link{min-height:48px;color:rgba(235,235,245,.72);border-radius:12px;transition:background 140ms ease-out,transform 100ms ease-out}
    .screen-link:hover{background:rgba(118,118,128,.2)}
    .screen-link:active{transform:scale(.985)}
    .screen-link[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 var(--gold)}
    .screen-link[aria-current="page"] b,.screen-link[aria-current="page"] .screen-link-icon{color:var(--gold)}
    .screen-link b{color:#dfb866;font-variant-numeric:tabular-nums}

    .stage{padding:24px;background:
      radial-gradient(circle at 62% -10%,rgba(255,253,250,.98),transparent 40%),
      radial-gradient(circle at 84% 18%,rgba(200,155,69,.13),transparent 25%),
      radial-gradient(circle at 40% 78%,rgba(72,108,82,.08),transparent 29%),
      var(--canvas)}
    .stage-shell{max-width:1010px;grid-template-columns:390px minmax(290px,1fr);gap:34px}
    .phone{width:390px;max-width:390px;height:min(844px,calc(100dvh - 48px));min-height:720px;border:8px solid #272321;border-radius:52px;background:var(--ivory);box-shadow:var(--shadow)}
    .phone::before{display:block;top:10px;width:124px;height:35px;border-radius:22px;background:#000}
    .status{height:51px;padding:13px 23px 0;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
    .app{padding-top:51px}
    .content{padding:12px 20px calc(112px + env(safe-area-inset-bottom));background-color:var(--ivory);background-image:
      radial-gradient(circle at 8% 4%,rgba(200,155,69,.2),transparent 30%),
      radial-gradient(circle at 96% 34%,rgba(72,108,82,.13),transparent 31%),
      radial-gradient(circle at 34% 92%,rgba(200,155,69,.12),transparent 34%),

    function installLiquidNav(previous){
      const bar=app.querySelector('.bottom-nav');if(!bar)return;
      const selected=bar.querySelector('.nav-btn.active');if(!selected)return;
      bar.querySelectorAll('.nav-btn').forEach(button=>button.setAttribute('aria-current',button===selected?'page':'false'));
      const lens=document.createElement('span');lens.className='nav-liquid-indicator';lens.setAttribute('aria-hidden','true');bar.append(lens);
      lens.style.left=selected.offsetLeft+'px';lens.style.top=selected.offsetTop+'px';lens.style.width=selected.offsetWidth+'px';lens.style.height=selected.offsetHeight+'px';
      const destination=lens.getBoundingClientRect();
      if(!previous||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      const dx=previous.left-destination.left,dy=previous.top-destination.top;
      if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
      const stretch=Math.min(1.32,1+Math.abs(dx)/600);
      lens.animate([
        {transform:`translate(${dx}px,${dy}px) scale(${previous.width/destination.width},1)`,offset:0},
        {transform:`translate(${dx*.58}px,${dy*.58}px) scale(${stretch},.88)`,offset:.3},
        {transform:`translate(${-Math.sign(dx)*3}px,0) scale(.97,1.03)`,offset:.78},
        {transform:'translate(0,0) scale(1)',offset:1}
      ],{duration:540,easing:'cubic-bezier(.22,.7,.25,1)'});
    }

    function installGestures(){if(currentId==='D-04'){const preview=app.querySelector('.outfit-preview'),group=app.querySelector('[aria-label="Outfit occasion"]');if(preview&&group){preview.classList.add('gesture-surface');preview.tabIndex=0;preview.setAttribute('aria-label','Outfit preview. Swipe or use arrow keys for another occasion.');preview.insertAdjacentHTML('afterend','<small class="gesture-hint">Swipe for another direction · occasion chips stay available</small>');let startX=0;const cycle=step=>{const buttons=[...group.querySelectorAll('button')],index=Math.max(0,buttons.findIndex(button=>button.getAttribute('aria-pressed')==='true')),next=buttons[(index+step+buttons.length)%buttons.length];selectChip(next);toast(next.textContent.trim())};preview.addEventListener('pointerdown',event=>startX=event.clientX);preview.addEventListener('pointerup',event=>{const delta=event.clientX-startX;if(Math.abs(delta)>45)cycle(delta<0?1:-1)});preview.addEventListener('keydown',event=>{if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();cycle(event.key==='ArrowRight'?1:-1)}})}}if(['F-01','F-02','F-03'].includes(currentId)){const rail=app.querySelector('.studio-options .mirror-piece-strip');if(rail){rail.insertAdjacentHTML('beforebegin','<small class="gesture-hint">Drag to reorder · tap any piece to select it</small>');let dragged=null;rail.querySelectorAll('.mirror-piece').forEach(piece=>{piece.draggable=true;piece.addEventListener('dragstart',()=>{dragged=piece;piece.classList.add('dragging')});piece.addEventListener('dragend',()=>piece.classList.remove('dragging'));piece.addEventListener('dragover',event=>event.preventDefault());piece.addEventListener('drop',event=>{event.preventDefault();if(dragged&&dragged!==piece){rail.insertBefore(dragged,piece);toast('Piece order updated')}})})}}if(['G-02','G-03','G-04','G-05','G-06','G-07'].includes(currentId)){const image=app.querySelector('.hero-img'),actions=app.querySelector('.content>.row');actions?.insertAdjacentHTML('afterend','<button class="btn wide" style="margin-top:8px" onclick="openLightweightPanel(\'share\')">Share this Look</button>');if(image){image.classList.add('gesture-surface');image.tabIndex=0;image.setAttribute('aria-label','Saved Look preview. Press and hold for quick share.');let timer;image.addEventListener('pointerdown',()=>timer=setTimeout(()=>openLightweightPanel('share'),550));['pointerup','pointercancel','pointerleave'].forEach(type=>image.addEventListener(type,()=>clearTimeout(timer)));image.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();openLightweightPanel('share')}})}}}

      return shell('Tutorial',`<p class="eyebrow">Getting started</p><h2 class="display">StyleIQ is your stylist.</h2><img class="hero-img" src="${assets.look}" alt="StyleIQ tutorial"><div class="choice-list" style="margin-top:14px">${[['Add to your Closet','B-01'],['Get styled','D-02'],['Save a Look','G-01'],['Create a Style Twin','H-01'],['Train Muse with feedback','E-03']].map(([label,id])=>`<button class="choice" onclick="go('${id}')"><b>${label}</b><span>›</span></button>`).join('')}</div>`,{active:'profile'});
    }
    function enrichCoreScreens(s){
      const content=app.querySelector('.content');
      if(!content)return;
      if(s.id==='L-01'){
        content.insertAdjacentHTML('beforeend',`<section class="muse-profile"><div class="muse-profile-head"><img src="${assets.muse}" alt="Muse"><span class="grow"><p class="eyebrow">What Muse has learned</p><h3 class="title">Your style, in focus</h3></span><button class="btn small-btn" onclick="go('L-05')">Refine</button></div><p class="body">You lean toward warm neutrals, clean lines, and relaxed tailoring. You save structured layers but wear softer combinations most often.</p><div class="palette" aria-label="Your learned color palette"><i style="background:#241f1b"></i><i style="background:#8d623d"></i><i style="background:#d7c4a5"></i><i style="background:#eee7db"></i><i style="background:#788071"></i></div><button class="btn primary wide" onclick="go('M-01')">Open Muse profile</button></section><section class="card" style="margin-top:12px"><div class="between"><span><p class="eyebrow">Style evolution</p><b>Relaxed tailoring is up 18%</b></span><span class="pill gold">This month</span></div><div class="evolution-bar"><span></span></div><p class="body" style="margin-top:10px">Muse found 3 new combinations around your blazer without adding another purchase.</p><button class="btn wide" style="margin-top:12px" onclick="go('M-03')">See the wardrobe insight</button></section>`);
      }
    }
    function museScreen(s){
      if(s.id==='M-01')return shell('Muse',`<div class="muse-profile-head"><img src="${assets.muse}" alt="Muse"><span><p class="eyebrow">From ${museContext.label}</p><h2 class="title">What can I style for you?</h2><p class="body">Muse is using this context with your Closet and preferences. Interpretation is simulated in this prototype.</p></span></div><div class="muse-context-card" role="status"><span class="icon-wrap">${icon('spark')}</span><span><b>Current context</b><small>${museContext.prompt}</small></span></div><div class="muse-prompt-grid"><button class="muse-prompt" onclick="canvasState.creationSource='muse_assisted';persist();go('M-02')"><span class="muse-prompt-icon">${icon('spark')}</span><b>Work from this context</b></button><button class="muse-prompt" onclick="canvasState.creationSource='muse_assisted';persist();go('F-01')"><span class="muse-prompt-icon">${icon('edit')}</span><b>Adjust the current Look</b></button><button class="muse-prompt" onclick="go('J-01')"><span class="muse-prompt-icon">${icon('bag')}</span><b>Help me pack</b></button><button class="muse-prompt" onclick="go('M-03')"><span class="muse-prompt-icon">${icon('search')}</span><b>Find a wardrobe gap</b></button></div><div class="field" style="margin-top:18px"><label>Ask in your own words</label><textarea class="textarea" placeholder="${museContext.prompt}"></textarea></div><button class="btn primary wide" style="margin-top:10px" onclick="canvasState.creationSource='muse_assisted';persist();go('M-02')">Ask Muse about this</button>`,{active:'home'});
      if(s.id==='M-02')return shell('Why this Look',`<p class="eyebrow">Muse’s recommendation</p><h2 class="display">Polished now. Easy later.</h2><img class="hero-img" src="${assets.look3}" alt="Tailored office Look recommended by Muse"><div class="reason-list"><div class="reason-row"><span class="icon-wrap">${icon('calendar')}</span><span><b>Your day</b><small class="body" style="display:block">Office-focused, with enough ease for dinner after work.</small></span></div><div class="reason-row"><span class="icon-wrap">${icon('spark')}</span><span><b>Your style</b><small class="body" style="display:block">Clean tailoring and warm neutrals match your strongest preferences.</small></span></div><div class="reason-row"><span class="icon-wrap">${icon('shirt')}</span><span><b>Your Closet</b><small class="body" style="display:block">Every piece is owned. The blazer has not been worn in 12 days.</small></span></div></div><div class="muse-actions"><button class="btn" onclick="go('D-04')">Alternatives</button><button class="btn primary" onclick="go('F-01')">Customize</button></div><button class="btn wide" style="margin-top:8px" onclick="go('E-01')">Wear & save this Look</button>`,{active:'home'});
      return shell('Wardrobe insight',`<div class="muse-profile-head"><img src="${assets.muse}" alt="Muse"><span><p class="eyebrow">Based on 14 saved decisions</p><h2 class="title">You don’t need another blazer.</h2></span></div><p class="body" style="margin-top:12px">Your real gap is a lightweight knit that works under the pieces you already own. It would unlock six combinations across work and weekend Looks.</p><div class="card" style="margin-top:16px"><img class="hero-img" style="height:180px" src="${assets.top2}" alt="Lightweight rust knit suggestion"><div class="between" style="margin-top:12px"><span><b>Lightweight knit</b><small class="body" style="display:block">Warm neutral · 6 possible Looks</small></span><span class="pill gold">Useful gap</span></div></div><div class="reason-list"><div class="reason-row"><span class="icon-wrap">${icon('check')}</span><span><b>No duplicate purchase</b><small class="body" style="display:block">Different role from your existing tops and layers.</small></span></div><div class="reason-row"><span class="icon-wrap">${icon('heart')}</span><span><b>High confidence</b><small class="body" style="display:block">Matches your palette, budget, and saved silhouettes.</small></span></div></div><button class="btn primary wide" onclick="go('K-02')">Review one suggestion</button><button class="btn wide" style="margin-top:8px" onclick="go('D-04')">Style without buying</button>`,{active:'home'});
    }
  </script>
</body>
</html>
